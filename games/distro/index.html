<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distro Match</title>
<link rel="stylesheet" href="shared/base.css">
<style>
.columns { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(16px, 8vw, 96px); }
.col { display: flex; flex-direction: column; gap: 10px; }
.col h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; color: var(--muted); }
.item {
  min-height: 56px; flex: 1;
  border-radius: 14px; border: 2px solid var(--line);
  background: var(--panel); color: #FFFFFF;
  font-size: clamp(18px, 2.3vw, 26px); font-weight: 700; line-height: 1.15;
  text-align: left; padding: 0 clamp(14px, 2vw, 24px);
  transition: background .15s;
}
.item.pm { font-family: var(--mono); }
.item.sel { background: var(--teal); border-color: var(--teal); color: var(--ink); }
.item.wrong { background: var(--warn); border-color: var(--warn); color: var(--ink); }
.item.matched { background: var(--green); border-color: var(--green); color: var(--ink); }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <div class="eyebrow">openSUSE Asia Summit 2026</div>
      <h1>Distro Match</h1>
    </div>
    <div class="stats" id="stats" hidden>
      <div class="pill"><span id="count">0</span>/<span id="total">8</span> matched</div>
      <div class="pill" id="timer">0:45</div>
    </div>
  </header>

  <section class="screen" id="ready">
    <div class="ready">
      <div class="intro">
        <p class="lead">Tap a distro, then tap its package manager.</p>
        <p class="sub"><span id="pairs">8</span> random pairs, <span id="secs">45</span> seconds. Different every round.</p>
        <p class="player" id="player"></p>
        <p class="drop-warn" id="drop-warn" hidden></p>
        <p class="name-err" id="name-err" role="alert"></p>
        <button class="btn-primary" id="start">Start</button>
        <div class="links">
          <a class="back" href="../">&larr; All games</a>
          <a class="back" href="../leaderboard/">Leaderboard</a>
        </div>
      </div>
      <div class="prizes">
        <h2>Prizes</h2>
        <div id="prize-rows"></div>
      </div>
    </div>
  </section>

  <section class="screen" id="play" hidden>
    <div class="columns">
      <div class="col"><h2>Distro</h2><div class="col" id="left"></div></div>
      <div class="col"><h2>Package manager</h2><div class="col" id="right"></div></div>
    </div>
  </section>

  <section class="screen" id="done" hidden>
    <div class="done">
      <div class="result" id="result"></div>
      <div class="label">Your prize</div>
      <div class="prize" id="prize"></div>
      <p class="rank" id="rank" aria-live="polite"></p>
      <p class="hint">Show this screen to the booth crew.</p>
      <p class="chance-note" id="chance-note"></p>
      <div class="done-actions" id="done-actions" hidden>
        <button class="btn-primary" id="claim">Take this prize</button>
        <button class="btn-ghost" id="retry">Use my 2nd chance</button>
      </div>
    </div>
  </section>
</main>
<script src="shared/game.js"></script>
<script>
(function () {
  const { $, shuffle, show, countdown, finish, loadConfig, renderPrizes, requirePlayer, begin, submit, doneButtons } = Booth;
  // Overridden by config/distro.json. Tiers apply only when all pairs are matched;
  // the first tier whose maxMistakes fits wins (no maxMistakes = any number).
  const DEFAULTS = {
    seconds: 45,
    tiers: [
      { prize: 'Pin + sticker', maxMistakes: 0 },
      { prize: 'Sticker pack' }
    ],
    fallback: 'Candy'
  };
  let cfg = DEFAULTS;
  // Each round takes PER_ROUND package managers at random and, for each, one of
  // its distros at random. Package managers are unique, so every round has exactly
  // one right answer per distro. Must match PAIRS["distro"] in admin/scores.py.
  const PER_ROUND = 8;
  const POOL = {
    'zypper': ['openSUSE Tumbleweed', 'openSUSE Leap', 'SUSE Linux Enterprise'],
    'transactional-update': ['openSUSE MicroOS'],
    'apt': ['Debian', 'Ubuntu', 'Linux Mint', 'Pop!_OS', 'Kali Linux', 'elementary OS'],
    'dnf': ['Fedora', 'Red Hat Enterprise Linux', 'Rocky Linux', 'AlmaLinux', 'CentOS Stream'],
    'tdnf': ['Photon OS'],
    'rpm-ostree': ['Fedora Silverblue'],
    'pacman': ['Arch Linux', 'Manjaro', 'EndeavourOS'],
    'apk': ['Alpine Linux', 'postmarketOS'],
    'emerge': ['Gentoo'],
    'xbps-install': ['Void Linux'],
    'nix-env': ['NixOS'],
    'guix': ['Guix System'],
    'eopkg': ['Solus'],
    'slackpkg': ['Slackware'],
    'urpmi': ['Mageia'],
    'tce-load': ['Tiny Core Linux']
  };
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  let round = [];  // [{ id, d, pm }], id = package manager

  let sel, wrong, matched, mistakes, timer, flash, session, starting = false;
  const leftCol = $('#left'), rightCol = $('#right');

  function render() {
    leftCol.querySelectorAll('.item').forEach((el) => {
      const id = el.dataset.id;
      el.classList.toggle('matched', matched.includes(id));
      el.classList.toggle('sel', sel === id);
      el.setAttribute('aria-pressed', sel === id ? 'true' : 'false');
    });
    rightCol.querySelectorAll('.item').forEach((el) => {
      const id = el.dataset.id;
      el.classList.toggle('matched', matched.includes(id));
      el.classList.toggle('wrong', wrong === id);
    });
    $('#count').textContent = matched.length;
  }

  function end(won) {
    timer.stop();
    clearTimeout(flash);
    const tier = won && cfg.tiers.find((t) => t.maxMistakes == null || mistakes <= t.maxMistakes);
    const prize = tier ? tier.prize : cfg.fallback;
    finish(won
      ? 'All ' + PER_ROUND + ' in ' + timer.used() + ' s with ' + mistakes + (mistakes === 1 ? ' mistake' : ' mistakes')
      : 'Time’s up. You matched ' + matched.length + ' of ' + PER_ROUND + '.', prize);
    submit(session, { matched: matched.length, mistakes: mistakes, used: won ? timer.used() : undefined });
  }

  function pickLeft(id) {
    if (matched.includes(id)) return;
    sel = id;
    render();
  }

  function pickRight(id) {
    if (!sel || matched.includes(id)) return;
    if (id === sel) {
      matched.push(id);
      sel = null;
      render();
      if (matched.length === round.length) end(true);
    } else {
      mistakes += 1;
      wrong = id;
      render();
      clearTimeout(flash);
      flash = setTimeout(() => { wrong = null; render(); }, 500);
    }
  }

  function fill(col, ids, label, cls, onPick) {
    col.innerHTML = '';
    ids.forEach((id) => {
      const b = document.createElement('button');
      b.className = 'item ' + cls;
      b.dataset.id = id;
      b.textContent = label(id);
      b.addEventListener('click', () => onPick(id));
      col.appendChild(b);
    });
  }

  async function start() {
    if (starting) return;
    starting = true;
    $('#start').disabled = true;
    session = await begin('distro');
    starting = false;
    $('#start').disabled = false;
    if (!session) return;
    round = shuffle(Object.keys(POOL)).slice(0, PER_ROUND).map((pm) => ({ id: pm, d: pick(POOL[pm]), pm: pm }));
    const byId = Object.fromEntries(round.map((p) => [p.id, p]));
    const ids = round.map((p) => p.id);
    sel = null; wrong = null; matched = []; mistakes = 0;
    fill(leftCol, shuffle(ids.slice()), (id) => byId[id].d, 'distro', pickLeft);
    fill(rightCol, shuffle(ids.slice()), (id) => byId[id].pm, 'pm', pickRight);
    render();
    show('play');
    timer = countdown(cfg.seconds, () => end(false));
  }

  function tierText(t) {
    const all = 'All ' + PER_ROUND;
    if (t.maxMistakes == null) return all + ' before time runs out';
    if (t.maxMistakes === 0) return all + ' with no mistakes';
    return all + ' with at most ' + t.maxMistakes + (t.maxMistakes === 1 ? ' mistake' : ' mistakes');
  }

  async function ready() {
    if (!await requirePlayer()) return;
    cfg = await loadConfig('distro', DEFAULTS);
    $('#secs').textContent = cfg.seconds;
    $('#pairs').textContent = $('#total').textContent = PER_ROUND;
    renderPrizes(cfg.tiers.map((t) => [tierText(t), t.prize]).concat([['Time ran out', cfg.fallback]]));
    show('ready');
  }

  $('#start').addEventListener('click', start);
  doneButtons(() => session);
  ready();
})();
</script>
</body>
</html>
