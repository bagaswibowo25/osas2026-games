<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command or Not?</title>
<link rel="stylesheet" href="shared/base.css">
<style>
.stage { flex: 1; display: flex; flex-direction: column; gap: 24px; }
.word-box {
  flex: 1; min-height: 220px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  border-radius: 24px; background: var(--panel); padding: 32px;
}
.word { font-family: var(--mono); font-size: clamp(36px, 7vw, 72px); font-weight: 700; color: var(--paper); text-align: center; overflow-wrap: anywhere; }
.feedback { min-height: 34px; font-size: clamp(18px, 2.4vw, 26px); font-weight: 600; text-align: center; }
.feedback.ok { color: var(--green); }
.feedback.bad { color: var(--warn); }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.answers button { min-height: 120px; border: 0; border-radius: 20px; color: var(--ink); font-size: clamp(26px, 3.4vw, 36px); font-weight: 800; }
.answers button:active { transform: scale(.98); }
#real { background: var(--green); }
#fake { background: var(--paper); }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <div class="eyebrow">openSUSE Asia Summit 2026</div>
      <h1>Command or Not?</h1>
    </div>
    <div class="stats" id="stats" hidden>
      <div class="pill"><span id="score">0</span> correct</div>
      <div class="pill" id="timer">0:30</div>
    </div>
  </header>

  <section class="screen" id="ready">
    <div class="ready">
      <div class="intro">
        <p class="lead">A word appears. Is it a real Linux command, or did we make it up?</p>
        <p class="sub">Answer as many as you can in <span id="secs">30</span> seconds.</p>
        <div class="fields">
          <label class="name">Your name<input id="name" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="next"></label>
          <label class="name">Instagram username
            <span class="ig-wrap"><input id="ig" maxlength="31" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" enterkeyhint="go"></span>
            <small>Only the booth crew sees this, to reach winners. Not shown on the leaderboard.</small>
          </label>
        </div>
        <p class="name-err" id="name-err" role="alert"></p>
        <button class="btn-primary" id="start">Start</button>
        <div class="links">
          <a class="back" href="../">&larr; All games</a>
          <a class="back" href="../leaderboard/">Leaderboard</a>
        </div>
      </div>
      <div class="prizes">
        <h2>Prizes</h2>
        <div id="prize-rows"></div>
      </div>
    </div>
  </section>

  <section class="screen" id="play" hidden>
    <div class="stage">
      <div class="word-box">
        <div class="word">$ <span id="word"></span></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
      </div>
      <div class="answers">
        <button id="real">Real command</button>
        <button id="fake">Made up</button>
      </div>
    </div>
  </section>

  <section class="screen" id="done" hidden>
    <div class="done">
      <div class="result" id="result"></div>
      <div class="label">Your prize</div>
      <div class="prize" id="prize"></div>
      <p class="rank" id="rank" aria-live="polite"></p>
      <p class="hint">Show this screen to the booth crew.</p>
      <button class="btn-ghost" id="again">Next player</button>
    </div>
  </section>
</main>
<script src="shared/game.js"></script>
<script>
(function () {
  const { $, shuffle, show, countdown, finish, loadConfig, renderPrizes, begin, submit, clearName } = Booth;
  // Overridden by config/command.json. Highest minCorrect reached wins.
  const DEFAULTS = {
    seconds: 30,
    tiers: [
      { prize: 'Pin + sticker', minCorrect: 12 },
      { prize: 'Sticker pack', minCorrect: 7 }
    ],
    fallback: 'Candy'
  };
  let cfg = DEFAULTS;
  // 24 real, 24 made up. Made-up names were checked against real tools with
  // similar names (netctl, pkgctl, updatectl, lsgpu... all exist), so avoid those.
  const WORDS = [
    { w: 'zypper', real: true, note: 'openSUSE\u2019s package manager' },
    { w: 'snapper', real: true, note: 'manages Btrfs snapshots' },
    { w: 'transactional-update', real: true, note: 'atomic updates on MicroOS' },
    { w: 'journalctl', real: true, note: 'reads systemd logs' },
    { w: 'firewall-cmd', real: true, note: 'configures firewalld' },
    { w: 'osc', real: true, note: 'Open Build Service command line' },
    { w: 'lsblk', real: true, note: 'lists block devices' },
    { w: 'rpm', real: true, note: 'low-level package tool' },
    { w: 'systemctl', real: true, note: 'starts and stops systemd services' },
    { w: 'hostnamectl', real: true, note: 'shows or sets the hostname' },
    { w: 'timedatectl', real: true, note: 'sets the clock and time zone' },
    { w: 'btrfs', real: true, note: 'manages Btrfs filesystems' },
    { w: 'yast2', real: true, note: 'starts YaST from the shell' },
    { w: 'dmesg', real: true, note: 'prints kernel messages' },
    { w: 'lscpu', real: true, note: 'shows CPU details' },
    { w: 'nmcli', real: true, note: 'NetworkManager command line' },
    { w: 'systemd-analyze', real: true, note: 'shows what slows down boot' },
    { w: 'distrobox', real: true, note: 'runs other distros in containers' },
    { w: 'kiwi-ng', real: true, note: 'builds openSUSE system images' },
    { w: 'bootctl', real: true, note: 'manages systemd-boot' },
    { w: 'tac', real: true, note: 'cat backwards: prints lines in reverse' },
    { w: 'yes', real: true, note: 'prints \u201cy\u201d forever' },
    { w: 'rev', real: true, note: 'reverses each line' },
    { w: 'factor', real: true, note: 'prints prime factors of a number' },
    { w: 'zypperctl', real: false, note: 'made up. The real one is zypper' },
    { w: 'geekoctl', real: false, note: 'made up' },
    { w: 'tumblectl', real: false, note: 'made up' },
    { w: 'yastify', real: false, note: 'made up. The real one is yast2' },
    { w: 'rpmgrab', real: false, note: 'made up' },
    { w: 'btrfs-undo', real: false, note: 'made up. Rollbacks use snapper' },
    { w: 'snapperize', real: false, note: 'made up' },
    { w: 'chameleon-sync', real: false, note: 'made up' },
    { w: 'leapctl', real: false, note: 'made up' },
    { w: 'geeko-update', real: false, note: 'made up. Use zypper up' },
    { w: 'snaprollback', real: false, note: 'made up. Use snapper rollback' },
    { w: 'journalview', real: false, note: 'made up. The real one is journalctl' },
    { w: 'lsram', real: false, note: 'made up. Try free' },
    { w: 'unzypper', real: false, note: 'made up' },
    { w: 'rpmify', real: false, note: 'made up' },
    { w: 'zypper-undo', real: false, note: 'made up. Undo with snapper' },
    { w: 'chmodx', real: false, note: 'made up. Use chmod +x' },
    { w: 'diskfree', real: false, note: 'made up. The real one is df' },
    { w: 'geekofetch', real: false, note: 'made up. Try fastfetch' },
    { w: 'tumbleweedctl', real: false, note: 'made up' },
    { w: 'zypper-turbo', real: false, note: 'made up' },
    { w: 'mkgeeko', real: false, note: 'made up' },
    { w: 'lsgeeko', real: false, note: 'made up' },
    { w: 'chameleonctl', real: false, note: 'made up' }
  ];

  let deck, idx, score, answered, timer, session, playing = false, starting = false;
  const fb = $('#feedback');

  function paintWord() { $('#word').textContent = deck[idx].w; }

  function answer(saysReal) {
    if (!playing) return;
    const cur = deck[idx];
    const ok = cur.real === saysReal;
    if (ok) score += 1;
    answered += 1;
    fb.textContent = (ok ? 'Correct. ' : 'Nope. ') + cur.w + ': ' + cur.note;
    fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    idx += 1;
    if (idx >= deck.length) {
      deck = shuffle(WORDS.slice());
      idx = 0;
      // don't show the word that was just answered again straight away
      if (deck[0].w === cur.w) [deck[0], deck[deck.length - 1]] = [deck[deck.length - 1], deck[0]];
    }
    $('#score').textContent = score;
    paintWord();
  }

  function end() {
    playing = false;
    const tier = cfg.tiers.find((t) => score >= t.minCorrect);
    const prize = tier ? tier.prize : cfg.fallback;
    finish(score + ' correct out of ' + answered + ' answered', prize);
    submit(session, { correct: score, answered: answered });
  }

  async function start() {
    if (starting) return;
    starting = true;
    $('#start').disabled = true;
    session = await begin('command');
    starting = false;
    $('#start').disabled = false;
    if (!session) return;
    deck = shuffle(WORDS.slice());
    idx = 0; score = 0; answered = 0; playing = true;
    fb.textContent = ''; fb.className = 'feedback';
    $('#score').textContent = 0;
    paintWord();
    show('play');
    timer = countdown(cfg.seconds, end);
  }

  async function ready() {
    clearName();
    cfg = await loadConfig('command', DEFAULTS);
    cfg.tiers = cfg.tiers.slice().sort((a, b) => b.minCorrect - a.minCorrect);
    $('#secs').textContent = cfg.seconds;
    const rows = cfg.tiers.map((t, i) => [
      i === 0 ? t.minCorrect + ' or more correct'
        : t.minCorrect + ' to ' + (cfg.tiers[i - 1].minCorrect - 1) + ' correct',
      t.prize
    ]);
    const lowest = cfg.tiers.length ? cfg.tiers[cfg.tiers.length - 1].minCorrect : null;
    rows.push([lowest == null ? 'Everyone' : 'Under ' + lowest, cfg.fallback]);
    renderPrizes(rows);
    show('ready');
  }

  $('#start').addEventListener('click', start);
  $('#real').addEventListener('click', () => answer(true));
  $('#fake').addEventListener('click', () => answer(false));
  $('#again').addEventListener('click', ready);
  ready();
})();
</script>
</body>
</html>
