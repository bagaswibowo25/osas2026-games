name: osas2026-games

# Each game is its own container. They join the ClassQuiz stack's network so
# its Caddy (which owns ports 80/443 on quiz.opensuse.id) can proxy to them:
#   /games/        -> games-hub:80      (game picker)
#   /games/memory  -> games-memory:80
#   /games/distro  -> games-distro:80
#   /games/command -> games-command:80
#   /games/admin   -> games-admin:8080  (prize settings, password in .env)
# See deploy/Caddyfile.snippet.

x-game: &game
  restart: always
  networks: [classquiz]
  # Prize config, written by the admin page (or by hand); picked up on the next
  # "Next player" / page load, no rebuild or restart needed.
  volumes:
    - ./config:/usr/share/nginx/html/config:ro
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
    interval: 30s
    timeout: 3s
    retries: 3

services:
  hub:
    <<: *game
    build: { context: ., args: { GAME: hub } }
    image: osas2026-games/hub
    container_name: games-hub

  memory:
    <<: *game
    build: { context: ., args: { GAME: memory } }
    image: osas2026-games/memory
    container_name: games-memory

  distro:
    <<: *game
    build: { context: ., args: { GAME: distro } }
    image: osas2026-games/distro
    container_name: games-distro

  command:
    <<: *game
    build: { context: ., args: { GAME: command } }
    image: osas2026-games/command
    container_name: games-command

  admin:
    build: { context: ., dockerfile: admin/Dockerfile }
    image: osas2026-games/admin
    container_name: games-admin
    restart: always
    networks: [classquiz]
    # Same uid as the host user so saved config files stay editable over SSH
    user: "1000:1000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  classquiz:
    external: true
    name: classquiz_default
