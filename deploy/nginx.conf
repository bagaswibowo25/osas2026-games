server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects stay relative so they keep the /games/<game>/ prefix Caddy strips
    absolute_redirect off;

    # Docker's DNS; resolving at request time lets nginx start even if games-admin is down
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Leaderboard API: /games/<game>/api/<x> -> games-admin:8080/play/<x>
    location /api/ {
        set $admin games-admin:8080;
        rewrite ^/api/(.*)$ /play/$1 break;
        proxy_pass http://$admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 16k;
    }

    # /games/leaderboard (no slash): relative Location keeps the /games prefix
    location = /leaderboard { return 308 leaderboard/; }

    location /shared/fonts/ { expires 30d; add_header Cache-Control "public, immutable"; }

    # Short cache so content tweaks show up on the booth tablets quickly
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
