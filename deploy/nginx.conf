server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /shared/fonts/ { expires 30d; add_header Cache-Control "public, immutable"; }

    # Short cache so content tweaks show up on the booth tablets quickly
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
